# ============================================================
# GitHub Actions CI/CD —— 自动部署到 GitHub Pages（作品㉗ 上线）
# ------------------------------------------------------------
# 触发: push 到 main 分支 + 手动触发
# 流程: checkout → node → install → type-check → test → build(VITE_BASE_URL=/task-manager/)
#       → 上传 Pages artifact → 部署 Pages
# ------------------------------------------------------------
# 复用 ui-kit(作品㉕) 验证过的 Pages 部署模板
# 学习重点: 与 ui-kit 相同, 但 base 是 /task-manager/ (子路径不同)
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键: task-manager 依赖 file:../ui-kit (本地 symlink)
      # CI 里没有本地文件 → 先检出 ui-kit, 再放到 ../ui-kit 相对路径
      # npm ci 处理 file: 依赖时会触发 ui-kit 的 prepublishOnly → 自动 build:lib
      - name: Checkout ui-kit
        uses: actions/checkout@v4
        with:
          repository: qtbsjy/ui-kit
          path: ci-ui-kit

      # 把 ui-kit 放到 file:../ui-kit 期望的位置(workspace 上级)
      # checkout 不允许 path 越界到 ../, 所以用 shell 移动
      - name: Place ui-kit at ../ui-kit (for file: dependency)
        run: |
          mkdir -p ../ui-kit
          cp -r ./ci-ui-kit/. ../ui-kit/
          rm -rf ./ci-ui-kit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 先构建 ui-kit 的 lib 产物( exports 指向 dist/lib, 必须 build:lib 才有)
      # npm ci 对 file: 依赖不自动触发 prepublishOnly, 需显式构建
      - name: Build ui-kit lib
        run: |
          cd ../ui-kit
          npm ci
          npm run build:lib

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      # Pages 子路径部署: /task-manager/
      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /task-manager/

      # SPA 深链回退: Pages 用 404.html 兜底, JS 接管路由
      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
