# ============================================================
# GitHub Actions CI/CD —— 自动部署到 GitHub Pages（作品㉗ 上线）
# ------------------------------------------------------------
# 触发: push 到 main 分支 + 手动触发
# 流程: checkout → node → install → type-check → test → build(VITE_BASE_URL=/task-manager/)
#       → 上传 Pages artifact → 部署 Pages
# ------------------------------------------------------------
# 复用 ui-kit(作品㉕) 验证过的 Pages 部署模板
# 学习重点: 与 ui-kit 相同, 但 base 是 /task-manager/ (子路径不同)
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      # Pages 子路径部署: /task-manager/
      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /task-manager/

      # SPA 深链回退: Pages 用 404.html 兜底, JS 接管路由
      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
